[project]
name = "anubis-customer-portal-server"
version = "0.1.0"
description = "Neural Nexus customer portal server (backend-for-frontend over Stripe and Auth0)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "scalar-fastapi>=1.0.3",
    "stripe>=12.0",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "aiosmtplib>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
