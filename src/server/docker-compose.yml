# Neural Nexus customer portal server — LIVE PRODUCTION stack.
#
#   docker compose -f docker-compose.yml up --build -d
#
# Loads .env (Stripe LIVE keys, PORTAL_ENV=live) and publishes the portal-server
# container on host port 8200. This is the stack the public reaches: the host
# cloudflared systemd service (the existing neuralnexus-api tunnel,
# 980ecf10-3835-4226-a164-dc22d13b2dc9) carries an ingress rule routing
# checkout-api.neuralnexus.site -> http://localhost:8200, and the Vercel client
# at anubis-customer-portal.vercel.app is built against that hostname. Nothing
# here needs to run for the tunnel itself to work.
#
# The Stripe test stack is docker-compose.dev.yml (project `portal-test`, host
# port 8202, .env.dev, not publicly exposed).
#
# The published port and the env file are written literally, and the project is
# named explicitly. That is deliberate: both compose files share this directory,
# so docker compose auto-loads ./.env as the interpolation source for BOTH of
# them. With literal values neither stack can be steered by the other's env
# file, and distinct project names stop each `up` from treating the other's
# container as an orphan.
#
# The cloudflared service below is an OPTIONAL alternative for hosts that do not
# already run a tunnel. It only starts when explicitly selected:
#   docker compose --profile bundled-tunnel up --build
# and it requires TUNNEL_TOKEN (a per-tunnel connector token) in .env plus a
# tunnel whose public hostname points at http://portal-server:8080 (the compose
# service name, not localhost — cloudflared would run inside this network).

name: portal-live

services:
  portal-server:
    build: .
    env_file:
      - .env
    ports:
      - "8200:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional; see the header comment. Not started by a plain `docker compose up`.
  cloudflared:
    profiles: ["bundled-tunnel"]
    image: cloudflare/cloudflared:latest
    env_file:
      - .env
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    depends_on:
      - portal-server
