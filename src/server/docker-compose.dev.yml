# Neural Nexus customer portal server — TEST stack.
#
#   docker compose -f docker-compose.dev.yml up --build -d
#
# Loads .env.dev (Stripe TEST keys, PORTAL_ENV=test, DEV=TRUE) and publishes the
# portal-server-dev container on host port 8202. This stack is NOT exposed
# through the Cloudflare tunnel — the tunnel's checkout-api.neuralnexus.site
# ingress rule targets host port 8200 only. It is reachable from this host, by
# the local client at http://localhost:5171 and by `npm run dev` on 5173.
#
# The live production stack is docker-compose.yml (project `portal-live`, host
# port 8200, .env), which is what the public and the Vercel client reach.
#
# The published port and the env file are written literally, and the project is
# named explicitly. That is deliberate: both compose files share this directory,
# so docker compose auto-loads ./.env — the LIVE env file — as the interpolation
# source for BOTH of them. With literal values this test stack cannot be steered
# by live values, and distinct project names stop each `up` from treating the
# other's container as an orphan.
#
# There is no cloudflared service here: the test stack is deliberately private.
# See docker-compose.yml for the optional bundled-tunnel profile.

name: portal-test

services:
  portal-server-dev:
    build: .
    env_file:
      - .env.dev
    ports:
      - "8202:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
