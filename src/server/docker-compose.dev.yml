# Neural Nexus customer portal server stack.
#
#   Test environment:  docker compose up --build
#   Live environment:  docker compose --env-file .env.live up --build
#
# The portal-server container is the backend-for-frontend the Vercel client
# calls. It is published on the host as ${PORT:-8200} -> container 8080.
#
# Public exposure of checkout-api.neuralnexus.site is handled by the HOST
# cloudflared systemd service (the existing neuralnexus-api tunnel,
# 980ecf10-3835-4226-a164-dc22d13b2dc9), whose ~/.cloudflared/config.yml carries
# a second ingress rule: checkout-api.neuralnexus.site -> http://localhost:8200.
# Nothing here needs to run for the tunnel to work.
#
# The cloudflared service below is an OPTIONAL alternative for hosts that do not
# already run a tunnel. It only starts when explicitly selected:
#   docker compose --profile bundled-tunnel up --build
# and it requires TUNNEL_TOKEN (a per-tunnel connector token) in the env file
# plus a tunnel whose public hostname points at http://portal-server:8080 (the
# compose service name, not localhost — cloudflared runs inside this network).
#
# Services read the env file selected by COMPOSE_ENV_FILE (defaults to .env.dev;
# set to .env.live for `COMPOSE_ENV_FILE=.env.live docker compose up`).

services:
  portal-server-dev:
    build: .
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.dev}
    ports:
      - "${PORT:-8202}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional; see the header comment. Not started by a plain `docker compose up`.
  # cloudflared:
  #   profiles: ["bundled-tunnel"]
  #   image: cloudflare/cloudflared:latest
  #   env_file:
  #     - ${COMPOSE_ENV_FILE:-.env.dev}
  #   command: tunnel --no-autoupdate run
  #   restart: unless-stopped
  #   depends_on:
  #     - portal-server
