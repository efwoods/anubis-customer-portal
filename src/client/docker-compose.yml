# Local development client (the production client deploys to Vercel).
#
#   docker compose up --build
#
# Set VITE_API_BASE_URL in .env (see .env.example).

services:
  portal-client:
    build: .
    env_file:
      - .env.dev
    # 5173 is reserved for another app; Vite and host publish both use 5171.
    ports:
      - "5171:5171"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
    restart: unless-stopped
