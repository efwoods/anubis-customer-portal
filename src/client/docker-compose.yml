# Local development client (the production client deploys to Vercel).
#
#   docker compose up --build
#
# Set VITE_API_BASE_URL in .env (see .env.example).

services:
  portal-client:
    build: .
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
    restart: unless-stopped
